# CI prepares one layout per architecture and publishes one combined release.
# Local preparation is safe: orchard-publish self/orchard.publish.toml --prepare
# Publication uses the public relays below; --relays overrides for local tests.

[app]
id = "rocks.orchard.Orchard"
name = "Orchard"
summary = "A permissionless Flatpak store"
description = "Install and update Flatpak apps without gatekeepers. Publishers sign their own releases as Nostr events; reviews are real events too, so trust comes from the people who use the app rather than from a curator. Orchard is published through Orchard, updates included."
categories = ["Utility"]
repository = "https://github.com/Letdown2491/orchard"
icon = "https://raw.githubusercontent.com/Letdown2491/orchard/main/assets/orchard-512.png"

[release]
version = "0.3.0"
arch = "linux-x86_64"
# Every declared platform must be present in the combined release.
platforms = ["linux-x86_64", "linux-aarch64"]
notes = "App pages show screenshots: publisher listings carry image URLs (the same strip reviewed apps always had). First release through the self-update chain: coming from 0.2.0, update in place; nothing to do by hand."

[artifact]
tree = "tree"

[publish]
# relay.orchard.rocks is the required relay (see PUBLISHING.md):
# orchard-publish refuses a manifest publish without it
relays = ["wss://relay.orchard.rocks", "wss://relay.primal.net", "wss://nos.lol"]
tag = "latest"
