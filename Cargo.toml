[workspace]
resolver = "3"
members = [
    "crates/orchard-core",
    "crates/orchard-flatpak",
    "crates/orchard-indexd",
    "crates/orchard-nostr",
    "crates/orchard-publish",
    "crates/orchard",
]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/Letdown2491/orchard"

[workspace.dependencies]
# internal
orchard-core = { path = "crates/orchard-core" }
orchard-flatpak = { path = "crates/orchard-flatpak" }
orchard-indexd = { path = "crates/orchard-indexd" }
orchard-nostr = { path = "crates/orchard-nostr" }
orchard-publish = { path = "crates/orchard-publish" }

# shared
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
axum = "0.8"
gpui = "0.2.2"

# catalog ingest (pure Rust backends: no zlib/openssl headers needed)
quick-xml = "0.38"
flate2 = "1"
sha2 = "0.10"
# blocking HTTP client for registry verification calls; rustls with the
# system trust store so real registries and local test CAs both work
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip", "json"] }
# NIP-01/NIP-82 events: keys, signing, signature verification (no async runtime)
# nip44/nip46: the Nostr Connect sign-in channel
nostr = { version = "0.45", features = ["os-rng", "nip44", "nip46"] }
# NIP-46 sign-in QR: the QR encoder is pure Rust, the PNG is written by
# hand on top of flate2 (no image crate)
qrcodegen = "1.8"
# publish side: deterministic OCI layer tarballs, gzip (mtime 0), manifest
# TOML, and the GVariant string-variant encoding of xa.metadata
tar = "0.4"
base64 = "0.22"
toml = "0.8"
