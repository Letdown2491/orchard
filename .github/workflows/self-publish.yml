# Orchard publishing itself. On a version tag (v1.2.3): build the
# binary in the dev container, assemble the app tree, push the OCI
# artifact to ghcr.io, and sign the NIP-82 events to the relays named
# in the publish manifest. Orchard then lists Orchard; updating
# Orchard is its own update path.
#
# One listing, both architectures: each runner builds its own arch
# and signs its own asset and release (per-arch `d`), while the
# listing declaring coverage for both is identical from either leg.
# The asset pins the artifact by digest, so the client on any machine
# pulls the artifact built for it.
#
# Required repository secret:
#   ORCHARD_NSEC  the publisher identity's secret key (nsec hex)
# The relay list is publishing policy, versioned in
# self/orchard.publish.toml, never a secret. GITHUB_TOKEN is both the
# registry password and the repository-proof credential (it refreshes
# orchard.txt on the default branch, hence contents: write); the
# package turns public via its settings after the first push.

name: self-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-latest
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build
        run: ./scripts/build.sh build --release

      - name: Assemble the app tree
        run: ./self/assemble.sh

      - name: Push and sign
        env:
          ORCHARD_NSEC: ${{ secrets.ORCHARD_NSEC }}
          ORCHARD_REGISTRY_USER: ${{ github.actor }}
          ORCHARD_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.2.3 becomes 1.2.3
          export ORCHARD_PUBLISH_VERSION="${GITHUB_REF_NAME#v}"
          target/release/orchard-publish self/orchard.publish.toml \
            --arch "${{ matrix.arch }}" \
            --registry "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --tag "latest-${{ matrix.arch }}" \
            --prove

      - name: Attach the artifact to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The digest-pinned docker:// one-liner cannot work against
          # ghcr: flatpak's image fetch never authenticates (it does
          # not even try a token on a 401). The release therefore
          # carries the artifact itself, as an oci-archive the README's
          # two-liner installs with flatpak's local path.
          tar -C "target/publish/rocks.orchard.Orchard" \
            -czf "orchard-${{ matrix.arch }}.oci.tgz" .
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "orchard-${{ matrix.arch }}.oci.tgz" --clobber
