# Orchard publishing itself. On a version tag (v1.2.3): build the
# binary in the dev container, assemble the app tree, push the OCI
# artifact to ghcr.io, and sign the NIP-82 events to the relays named
# in the publish manifest. Orchard then lists Orchard; updating
# Orchard is its own update path.
#
# One release, both architectures: each runner pushes its OCI artifact and
# exports unsigned asset metadata. The final job signs one release referencing
# both assets, so architecture jobs cannot overwrite each other's release.
#
# Required repository secret:
#   ORCHARD_NSEC  the publisher identity's secret key (nsec hex)
# The relay list is publishing policy, versioned in
# self/orchard.publish.toml, never a secret. GITHUB_TOKEN is both the
# registry password and the repository-proof credential (it refreshes
# orchard.txt on the default branch, hence contents: write); the
# package turns public via its settings after the first push.

name: self-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-latest
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build
        run: ./scripts/build.sh build --release

      - name: Assemble the app tree
        run: ./self/assemble.sh

      - name: Push artifact and export metadata
        env:
          ORCHARD_REGISTRY_USER: ${{ github.actor }}
          ORCHARD_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the Fedora-built publisher in its build environment.
          podman run --rm -v "$PWD:/work:Z" -w /work \
            -e ORCHARD_REGISTRY_USER -e ORCHARD_REGISTRY_PASSWORD \
            -e ORCHARD_PUBLISH_VERSION="${GITHUB_REF_NAME#v}" \
            localhost/orchard-dev-rust \
            target/release/orchard-publish self/orchard.publish.toml \
            --upload-only --arch "${{ matrix.arch }}" --out dist \
            --registry "ghcr.io/${GITHUB_REPOSITORY,,}"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.arch }}
          path: dist/*.asset.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'linux-x86_64'
        with:
          name: publisher
          path: target/release/orchard-publish
          if-no-files-found: error

      - name: Attach the artifact to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The digest-pinned docker:// one-liner cannot work against
          # ghcr: flatpak's image fetch never authenticates (it does
          # not even try a token on a 401). The release therefore
          # carries the artifact itself, as an oci-archive the README's
          # two-liner installs with flatpak's local path.
          cp "dist/rocks.orchard.Orchard-${{ matrix.arch }}.oci.tgz" \
            "orchard-${{ matrix.arch }}.oci.tgz"
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "orchard-${{ matrix.arch }}.oci.tgz" --clobber

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: publisher
          path: dist/bin

      - name: Sign the combined release
        env:
          ORCHARD_NSEC: ${{ secrets.ORCHARD_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          chmod +x dist/bin/orchard-publish
          podman run --rm -v "$PWD:/work:Z" -w /work \
            -e ORCHARD_NSEC -e GITHUB_TOKEN \
            -e ORCHARD_PUBLISH_VERSION="${GITHUB_REF_NAME#v}" \
            registry.fedoraproject.org/fedora:43 \
            dist/bin/orchard-publish self/orchard.publish.toml \
            --asset dist/rocks.orchard.Orchard-linux-x86_64.asset.json \
            --asset dist/rocks.orchard.Orchard-linux-aarch64.asset.json --legacy-oci --prove
